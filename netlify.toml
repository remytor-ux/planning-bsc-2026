[build]
  command = "pip install -r requirements.txt && python3 generate_planning.py data/BSC_Planning_2026V2.xlsx public"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.11"

# Demande aux moteurs de recherche de ne pas référencer le site
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Données du planning lues par l'application « Outils Médecin » (autorise la lecture depuis un autre site)
[[headers]]
  for = "/planning-data.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"

# Agendas individuels (.ics) : abonnement depuis un téléphone / lecture depuis l'outil
[[headers]]
  for = "/ics/*"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"
