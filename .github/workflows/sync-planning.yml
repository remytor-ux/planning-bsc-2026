name: Synchroniser le planning depuis OneDrive

on:
  schedule:
    # Toutes les 30 minutes. Ajuste la fréquence si besoin (attention : GitHub
    # peut retarder légèrement les cron sur les dépôts gratuits en cas de charge).
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # permet de le lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests

      - name: Télécharger la dernière version depuis OneDrive
        run: >
          python3 sync_from_onedrive.py
          "${{ secrets.ONEDRIVE_SHARE_URL }}"
          data/BSC_Planning_2026V2.xlsx

      - name: Commit si le fichier a changé
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          if git diff --quiet data/BSC_Planning_2026V2.xlsx; then
            echo "Aucun changement détecté."
          else
            git add data/BSC_Planning_2026V2.xlsx
            git commit -m "Sync planning depuis OneDrive"
            git push
          fi
